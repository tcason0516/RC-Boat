plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rcboat.racing'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rcboat.racing'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // A fixed key kept in the repo so every build can be installed over the previous one.
        shared {
            storeFile rootProject.file('keystore/rcboat.jks')
            storePassword 'rcboat123'
            keyAlias 'rcboat'
            keyPassword 'rcboat123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Two apps from one code base: the racing game, and the combat version (weapons, last
    // boat standing). They install side by side.
    flavorDimensions 'game'
    productFlavors {
        racing {
            dimension 'game'
            applicationId 'com.rcboat.racing'
            buildConfigField 'boolean', 'COMBAT', 'false'
            resValue 'string', 'app_name', 'RC Boat Racing'
        }
        combat {
            dimension 'game'
            applicationId 'com.rcboat.combat'
            buildConfigField 'boolean', 'COMBAT', 'true'
            resValue 'string', 'app_name', 'RC Boat Combat'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
