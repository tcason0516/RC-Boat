name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRacingRelease assembleCombatRelease
          cp app/build/outputs/apk/racing/release/app-racing-release.apk RCBoatRacing.apk
          cp app/build/outputs/apk/combat/release/app-combat-release.apk RCBoatCombat.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCBoat-apks
          path: |
            RCBoatRacing.apk
            RCBoatCombat.apk

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          # remove any leftover draft releases from earlier runs
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" -q '.[] | select(.draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id" || true
          done
          gh release create latest RCBoatRacing.apk RCBoatCombat.apk \
            --target "$GITHUB_SHA" \
            --title "RC Boat Racing and RC Boat Combat (latest builds)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap RCBoatRacing.apk (racing) or RCBoatCombat.apk (combat: weapons, last boat standing) to download and install. The two apps install side by side."
          gh release edit latest --draft=false --latest
