name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk RCBoatRacing.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCBoatRacing-apk
          path: RCBoatRacing.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RCBoatRacing.apk \
            --title "RC Boat Racing (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your Android phone and tap RCBoatRacing.apk to download and install."
